<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>13 / 13 · Contact · FaleraOS sponsor deck</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .email {
      margin-top: 72px;
      font-size: 56px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--red);
    }
    .links {
      margin-top: 40px;
      font-family: var(--mono);
      font-size: 27px;
      line-height: 1.8;
      color: var(--dim);
    }
    .lumi {
      position: absolute;
      right: 190px;
      bottom: -100px;
      width: 520px;
    }
  </style>
</head>
<body>
<div class="slide">
  <!-- No corner mark on the last slide: Lumi is drawn large instead. -->
  <div class="body">
    <div class="eyebrow">
      <img class="bow-34" src="../assets/bow.svg" alt="">
      <span>Thank you</span>
    </div>

    <h2 class="title" style="margin-top: 120px; font-size: 104px; max-width: 1100px">
      Help build the <em>first Falera badges.</em>
    </h2>

    <div class="email">hello@elixpo.com</div>

    <div class="links">
      <div>falera.elixpo.com</div>
      <div>github.com/elixpo/falera</div>
      <div>payouts.elixpo.com/f/falera-badge</div>
    </div>

    <img class="lumi" src="../assets/lumi-badge.webp" alt="Lumi, the Falera panda, holding a badge">
  </div>

  <!-- Footer -->
  <div class="footer">
    <span><b>FaleraOS</b> · Elixpo</span>
    <span class="num">13 / 13</span>
    <span>falera.elixpo.com</span>
  </div>
</div>
</body>
</html>
