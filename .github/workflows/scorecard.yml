# OpenSSF Scorecard: grades the repository's security practices and publishes
# the result, which powers the Scorecard badge in the README.
# https://github.com/ossf/scorecard-action
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 3 * * 1"   # weekly, Monday 03:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload results to code scanning
      id-token: write          # publish results to the OpenSSF API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@d0bae162f31f17dd92c46ccdc4dfee5710f8dc67 # v3
        with:
          sarif_file: results.sarif
