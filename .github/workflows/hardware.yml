# Checks the KiCad design on every pull request that touches circuit/.
#
# The schematic sheets are generated by circuit/elixpo/generate_badge_schematic.py,
# so the job regenerates them and fails if the committed .kicad_sch files or
# BOM_PRELIMINARY.csv differ (edit the generator, then run build.sh). Then it
# runs ERC, which must report no errors and no warnings, and uploads the PDF,
# the BOM and the ERC report so reviewers can read the change without KiCad.
name: Hardware

on:
  pull_request:
    branches: [main]
    paths:
      - "circuit/**"
      - ".github/workflows/hardware.yml"
  push:
    branches: [main]
    paths:
      - "circuit/**"

permissions:
  contents: read

concurrency:
  group: hardware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kicad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # The KiCad version the design is saved with (circuit/elixpo/README.md).
      image: kicad/kicad:10.0.5
      options: --user root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Regenerate the schematic
        run: python3 circuit/elixpo/generate_badge_schematic.py

      - name: Committed schematic matches the generator
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git diff --exit-code --stat -- circuit/; then
            echo "::error::The committed schematic differs from generate_badge_schematic.py. Edit the generator, run circuit/elixpo/build.sh and commit what it writes."
            exit 1
          fi

      - name: ERC, PDF and BOM
        run: |
          mkdir -p circuit/elixpo/build
          kicad-cli sch erc circuit/elixpo/elixpo.kicad_sch --severity-all \
            --exit-code-violations --output circuit/elixpo/build/erc.rpt \
            || { cat circuit/elixpo/build/erc.rpt; exit 1; }
          kicad-cli sch export pdf circuit/elixpo/elixpo.kicad_sch \
            --output circuit/elixpo/build/oreo-badge-schematic.pdf
          kicad-cli sch export bom circuit/elixpo/elixpo.kicad_sch \
            --fields 'Reference,Value,Footprint,QUANTITY,DNP' \
            --labels 'Refs,Value,Footprint,Qty,DNP' \
            --output circuit/elixpo/build/kicad-bom.csv

      - name: DRC (once the board has a layout)
        run: |
          if grep -q "(footprint" circuit/elixpo/elixpo.kicad_pcb; then
            kicad-cli pcb drc circuit/elixpo/elixpo.kicad_pcb --severity-error \
              --schematic-parity --exit-code-violations \
              --output circuit/elixpo/build/drc.rpt \
              || { cat circuit/elixpo/build/drc.rpt; exit 1; }
          else
            echo "No footprints on the board yet: DRC skipped."
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: oreo-badge-hardware
          path: circuit/elixpo/build/
          if-no-files-found: ignore
