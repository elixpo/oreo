name: Hack proposal
description: A step-by-step recipe for docs/hacks/, shown on oreo.elixpo.com/hacks.
title: "hack: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        A hack is one Markdown file in [docs/hacks/](https://github.com/elixpo/oreo/blob/main/docs/hacks/README.md):
        a short recipe someone can follow with a badge. Every command, file
        and function it names must exist; what does not work yet is said
        plainly, with the issue linked.

  - type: input
    id: title
    attributes:
      label: Title
      placeholder: "e.g. Show your talk schedule on the badge"
    validations:
      required: true

  - type: textarea
    id: shows
    attributes:
      label: What it shows
      description: What the reader ends up with, and the main steps.
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Hardware needed
      multiple: true
      options:
        - A badge as built (no extra parts)
        - The IMU (MPU-6050)
        - IR receiver and transmitter
        - microSD card
        - Extra parts or wiring (describe below)
        - No badge (host tools only)
    validations:
      required: true

  - type: textarea
    id: parts
    attributes:
      label: Extra parts, tools or accounts (optional)
      description: Components and wiring, host programs (ffmpeg, KiCad), API keys the reader needs.

  - type: dropdown
    id: level
    attributes:
      label: Difficulty
      options:
        - beginner
        - intermediate
        - advanced
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code it relies on
      description: The commands, apps and modules the hack uses (for example `oreo setup`, `oreoWare/imu.py`), and any open issue that limits it.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the project's [Code of Conduct](https://github.com/elixpo/oreo/blob/main/CODE_OF_CONDUCT.md).
          required: true
