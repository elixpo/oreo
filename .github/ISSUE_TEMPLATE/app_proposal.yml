name: App proposal
description: An app for the badge, for the App Store or built in. Agree on the idea before you build it.
title: "app: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Apps are MicroPython packages the OS loads at runtime. Before you
        start, skim [docs/APPS.md](https://github.com/elixpo/oreo/blob/main/docs/APPS.md):
        a 320x240 screen, eight buttons, a small heap, and nothing in
        `update()` or `draw()` may block. `oreo new my_app` gives you a
        working starting point.

  - type: input
    id: app_name
    attributes:
      label: App name
      placeholder: "e.g. Booth Bingo"
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What it does and who it is for, in a paragraph. Screenshots or sketches welcome.
    validations:
      required: true

  - type: textarea
    id: controls
    attributes:
      label: Controls
      description: |
        What each button does. A confirms and B goes back; HOME belongs to the OS.
        C opens the notification panel unless the app sets `CAPTURES_C = True`.
      placeholder: |
        LEFT / RIGHT  move
        A             pick
        B             back
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: App Store or built in?
      description: Most new apps belong in the App Store (`apps_market/`). Built-in apps (`apps/`) are installed on every badge and must earn the flash space.
      options:
        - App Store (apps_market/)
        - Built in (apps/)
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: needs
    attributes:
      label: What it needs
      options:
        - label: Wi-Fi (internet only, through `oreoOS._http` on a worker)
        - label: The owner's profile (`oreoOS.profile`)
        - label: The IMU (tilt, motion)
        - label: IR
        - label: Saved state (`oreoOS.state`)
        - label: New sprites or sounds

  - type: textarea
    id: assets
    attributes:
      label: Assets and other notes (optional)
      description: Sprites, icons, data sources, licences of anything you did not make.

  - type: dropdown
    id: who
    attributes:
      label: Who is building it?
      options:
        - I will send a pull request
        - I would like help
        - Someone else, please
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the project's [Code of Conduct](https://github.com/elixpo/oreo/blob/main/CODE_OF_CONDUCT.md).
          required: true
