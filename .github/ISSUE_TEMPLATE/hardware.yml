name: Hardware
description: The badge's schematic, PCB, parts, power or mechanics, or a driver for new hardware.
title: "hardware: "
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: |
        The badge is certified open source hardware (OSHWA IN000107) and its
        KiCad design is in [`circuit/elixpo/`](https://github.com/elixpo/oreo/tree/main/circuit/elixpo),
        under CERN-OHL-P-2.0. Read the [hardware section of CONTRIBUTING.md](https://github.com/elixpo/oreo/blob/main/CONTRIBUTING.md#work-on-the-hardware)
        first: the schematic sheets are generated by `generate_badge_schematic.py`,
        so a schematic change is a change to that script.

        The pins the OS uses are in [`oreoWare/pins.py`](https://github.com/elixpo/oreo/blob/main/oreoWare/pins.py);
        the breadboard build is in [`docs/HARDWARE.md`](https://github.com/elixpo/oreo/blob/main/docs/HARDWARE.md).

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Schematic (circuit/elixpo)
        - PCB layout
        - Power (charger, regulators, battery, fuel gauge)
        - Parts and BOM (sourcing, alternatives, cost)
        - Pin map (oreoWare/pins.py)
        - Driver for new hardware (oreoWare)
        - Breadboard build (docs/HARDWARE.md, docs/BREADBOARD_BOM.md)
        - Case, lanyard, mechanics
        - Manufacturing (fab outputs, assembly)
        - Something else
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing in the design today. Name the parts (reference designators like U4, R17) and nets.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: |
        What you would change and why: parts with manufacturer part numbers,
        datasheet links, the calculation behind a value, and the pins it uses
        or frees. A change to pins also changes `oreoWare/pins.py` and the
        drivers that use them.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: How it will be checked
      description: |
        ERC and DRC (CI runs both), a calculation or simulation, a breadboard or
        breakout test, and what can only be checked on an assembled board.

  - type: dropdown
    id: who
    attributes:
      label: Who is building it?
      options:
        - I will send a pull request
        - I can review, not build
        - I would like help
        - Someone else, please
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Licence and Code of Conduct
      options:
        - label: I agree that hardware design files I contribute are licensed under CERN-OHL-P-2.0, as [PREAMBLE.md](https://github.com/elixpo/oreo/blob/main/PREAMBLE.md) says.
          required: true
        - label: I agree to follow the project's [Code of Conduct](https://github.com/elixpo/oreo/blob/main/CODE_OF_CONDUCT.md).
          required: true
